<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jarvis Web</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.4;
        }
        .user {
            background-color: #0b93f6;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .jarvis {
            background-color: #2a2a2a;
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        #controls {
            padding: 20px;
            background-color: #1e1e1e;
            display: flex;
            justify-content: center;
            align-items: center;
            border-top: 1px solid #333;
        }
        #mic-btn {
            width: 70px;
            height: 70px;
            border-radius: 35px;
            background-color: #f44336;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.1s, background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #mic-btn:active {
            transform: scale(0.95);
        }
        #mic-btn.recording {
            background-color: #4CAF50;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(76, 175, 80, 0); }
            100% { box-select: 0 0 0 0 rgba(76, 175, 80, 0); }
        }
        #status {
            text-align: center;
            font-size: 14px;
            color: #888;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div id="chat-container">
        <div class="message jarvis">Hello. I am online. Tap the microphone to speak.</div>
    </div>
    
    <div id="status">Ready</div>
    
    <div id="controls">
        <button id="mic-btn">🎤</button>
    </div>

    <script>
        const micBtn = document.getElementById('mic-btn');
        const status = document.getElementById('status');
        const chatContainer = document.getElementById('chat-container');
        
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function addMessage(text, sender, id = null) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.textContent = text;
            if (id) div.id = id;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div;
        }

        async function initAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    audioChunks = [];
                    await sendAudio(audioBlob);
                };
                
                return true;
            } catch (err) {
                console.error("Error accessing microphone:", err);
                status.textContent = "Microphone access denied";
                return false;
            }
        }

        // Toggle recording on click/tap instead of hold-to-talk
        micBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        });

        async function startRecording() {
            if (!mediaRecorder) {
                const ready = await initAudio();
                if (!ready) return;
            }

            audioChunks = [];
            mediaRecorder.start();
            isRecording = true;
            micBtn.classList.add('recording');
            micBtn.textContent = "⏹"; // Change icon to stop
            status.textContent = "Listening... Tap to stop.";
        }

        function stopRecording() {
            mediaRecorder.stop();
            isRecording = false;
            micBtn.classList.remove('recording');
            micBtn.textContent = "🎤";
            status.textContent = "Processing...";
        }

        async function sendAudio(blob) {
            const msgId = "msg-" + Date.now();
            addMessage("Transcribing...", "user", msgId);
            
            const formData = new FormData();
            formData.append('audio', blob, 'recording.webm');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) throw new Error("Server error");
                
                const data = await response.json();
                
                // Update user message with what Jarvis actually heard
                const userMsg = document.getElementById(msgId);
                if (userMsg) {
                    if (data.user_text) {
                        userMsg.textContent = data.user_text;
                    } else {
                        userMsg.textContent = "(Silence detected)";
                    }
                }

                // If Jarvis ignored it (e.g. hallucination filter), don't show empty response
                if (data.text) {
                    addMessage(data.text, "jarvis");
                }
                
                status.textContent = "Ready";

                if (data.audio_base64) {
                    playAudioBase64(data.audio_base64);
                }

            } catch (err) {
                console.error(err);
                status.textContent = "Error occurred";
                const userMsg = document.getElementById(msgId);
                if (userMsg) {
                    userMsg.textContent = "Failed to send";
                }
            }
        }

        function playAudioBase64(base64Str) {
            const binaryString = window.atob(base64Str);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            
            audioCtx.decodeAudioData(bytes.buffer, function(buffer) {
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(audioCtx.destination);
                source.start(0);
            }, function(err) {
                console.error("Error decoding audio data", err);
            });
        }
    </script>
</body>
</html>
